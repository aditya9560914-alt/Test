<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Data Table</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="table-container">
        <h2>Dynamic Data Table</h2>

        <!-- Controls Header -->
        <div class="table-controls">
            <input type="text" id="searchInput" placeholder="Search by name, role, or status...">
            <button id="openModalBtn" class="btn primary">+ Add User</button>
        </div>

        <!-- Main Table -->
       <table id="dataTable">
  <thead>
    <tr>
      <th data-column="id">ID <span class="sort-icon">↕</span></th>
      <th data-column="userId">User <span class="sort-icon">↕</span></th>
      <th data-column="title">Title <span class="sort-icon">↕</span></th>
      <th data-column="completed">Status <span class="sort-icon">↕</span></th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

        <!-- Pagination Controls -->
        <div class="pagination-controls">
            <button id="prevBtn" class="btn secondary">Previous</button>
            <span id="pageInfo">Page 1 of 1</span>
            <button id="nextBtn" class="btn secondary">Next</button>
        </div>
    </div>

    <!-- Add Row Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <h3>Add New Record</h3>
            <form id="addUserForm">
                <div class="form-group">
                    <label for="userName">Name</label>
                    <input type="text" id="userName" required>
                </div>
                <div class="form-group">
                    <label for="userRole">Role</label>
                    <input type="text" id="userRole" required>
                </div>
                <div class="form-group">
                    <label for="userStatus">Status</label>
                    <select id="userStatus">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                        <option value="Pending">Pending</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" id="closeModalBtn" class="btn secondary">Cancel</button>
                    <button type="submit" class="btn primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
